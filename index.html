<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby & Sayang's Arcade ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-hearts" aria-hidden="true">♡ ♡ ♡</div>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Made for Baby & Sayang</p>
      <h1>Our Little <span>Arcade</span> 🎮❤️</h1>
      <p class="sub">Create one room, share the code, and play together from two different phones.</p>
    </section>

    <section class="panel" id="lobbyPanel">
      <div class="tabs">
        <button class="tab active" id="createTab">Create Room</button>
        <button class="tab" id="joinTab">Join Room</button>
      </div>

      <div class="form-view" id="createView">
        <label>Your name</label>
        <input id="hostName" maxlength="20" value="Baby" placeholder="Baby" />
        <button class="primary" id="createRoomBtn">Create Room ❤️</button>
      </div>

      <div class="form-view hidden" id="joinView">
        <label>Your name</label>
        <input id="guestName" maxlength="20" value="Sayang" placeholder="Sayang" />
        <label>Room code</label>
        <input id="roomCodeInput" maxlength="8" placeholder="e.g. A7K2" autocomplete="off" />
        <button class="primary" id="joinRoomBtn">Join Room 💗</button>
      </div>
      <p class="status" id="statusText"></p>
    </section>

    <section class="panel hidden" id="roomPanel">
      <p class="eyebrow">Private room</p>
      <h2>Room <span id="roomCodeLabel"></span></h2>
      <button class="copy-btn" id="copyCodeBtn">Copy room code</button>

      <div class="players">
        <div class="player-card"><span>👑</span><small>Host</small><strong id="hostLabel">Baby</strong></div>
        <div class="vs">❤️</div>
        <div class="player-card"><span>🎀</span><small>Player 2</small><strong id="guestLabel">Waiting...</strong></div>
      </div>

      <div class="connection" id="connectionState">Waiting for your person to join...</div>

      <div class="games">
        <button class="game-card" data-game="card-battle">
          <span class="emoji">🃏</span>
          <div><b>Couple Card Battle</b><small>Turn-based battle of hearts & special cards.</small></div>
        </button>
        <button class="game-card" data-game="love-pong" disabled>
          <span class="emoji">🏓</span>
          <div><b>Love Pong</b><small>Coming after Card Battle.</small></div>
        </button>
        <button class="game-card" data-game="caja-adventure" disabled>
          <span class="emoji">🐘</span>
          <div><b>Caja Adventure</b><small>Co-op adventure coming soon.</small></div>
        </button>
      </div>

      <button class="leave" id="leaveRoomBtn">Leave room</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
